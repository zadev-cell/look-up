[project]
name = "look-up"
version = "0.1.0"
description = "The night sky inside Claude: an MCP server with an interactive sky chart."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "zadev-cell", email = "347133798+zadev-cell@users.noreply.github.com" }
]
requires-python = ">=3.12"
# Horizon installs from these ranges (not uv.lock), so keep them to the versions we test.
dependencies = [
    "astronomy-engine>=2.1.19,<3",
    "fastmcp>=4.1.6,<5",
    "tzdata>=2026.6",
]

[project.scripts]
look-up = "look_up.server:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
